<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Matrix</title>
<style>
  :root, [data-theme="tokyo"] {
    --bg: #1a1b26; --panel: #24283b; --fg: #c0caf5; --muted: #565f89;
    --accent: #7aa2f7; --ok: #9ece6a; --err: #f7768e; --border: #3b4261;
  }
  [data-theme="light"] {
    --bg: #fafafa; --panel: #ffffff; --fg: #383a42; --muted: #a0a1a7;
    --accent: #4078f2; --ok: #50a14f; --err: #e45649; --border: #e5e5e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif; display: flex; justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .themes button { padding: 6px 10px; font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--border); }
  .themes button.on { border-color: var(--accent); color: var(--accent); }
  section { margin-top: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  input:not([type=range]) {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--border); outline: none;
  }
  input:focus { border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { border-radius: 8px; cursor: pointer; font: inherit; }
  .go {
    padding: 12px 16px; font-weight: 600; white-space: nowrap;
    background: var(--accent); color: var(--bg); border: none;
  }
  .chip {
    padding: 8px 12px; font-size: 14px; background: var(--panel);
    color: var(--fg); border: 1px solid var(--border);
  }
  .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #status { margin-top: 20px; min-height: 22px; font-size: 14px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <header>
    <h1>LED Matrix</h1>
    <div class="themes">
      <button data-t="tokyo">Tokyo Night</button>
      <button data-t="light">One Light</button>
    </div>
  </header>

  <section>
    <label for="ip">ESP32 IP (shown on the matrix at boot)</label>
    <input id="ip" placeholder="192.168.43.100" inputmode="decimal" autocomplete="off">
  </section>

  <section>
    <label for="text">Text</label>
    <div class="row">
      <input id="text" placeholder="hello" maxlength="190" autocomplete="off">
      <button class="go" id="sendText">Send</button>
    </div>
  </section>

  <section>
    <label for="secs">Countdown (seconds)</label>
    <div class="row">
      <input id="secs" type="number" min="1" max="5999" placeholder="30" inputmode="numeric">
      <button class="go" id="startCd">Start</button>
    </div>
    <div class="chips">
      <button class="chip" data-s="10">10s</button>
      <button class="chip" data-s="60">1m</button>
      <button class="chip" data-s="300">5m</button>
      <button class="chip" data-s="1500">25m</button>
    </div>
  </section>

  <section>
    <label>Clock</label>
    <button class="chip" id="clock">Show time</button>
  </section>

  <section>
    <label for="bright">Brightness <span id="bv"></span></label>
    <input id="bright" type="range" min="0" max="15">
  </section>

  <div id="status"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('.themes button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    store.set('theme', t);
  }
  document.querySelectorAll('.themes button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
  setTheme(store.get('theme') || 'tokyo');

  $('ip').value = store.get('ip') || '';
  $('bright').value = store.get('bright') || 1;
  $('bv').textContent = $('bright').value;

  function status(cls, text) { const s = $('status'); s.className = cls; s.textContent = text; }

  // no-cors: the request still reaches the ESP32; we just don't read the reply body.
  async function call(path, doneMsg) {
    const ip = $('ip').value.trim();
    if (!ip) return status('err', 'Enter the ESP32 IP');
    store.set('ip', ip);
    status('', 'Sending...');
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      await fetch(`http://${ip}${path}`, { mode: 'no-cors', signal: ctrl.signal });
      clearTimeout(timer);
      status('ok', doneMsg);
    } catch (e) {
      status('err', 'No reply. Check the IP and that you are on the same WiFi.');
    }
  }

  function sendText() {
    const t = $('text').value;
    if (!t) return status('err', 'Type some text');
    call(`/show?text=${encodeURIComponent(t)}`, `Shown: "${t}"`);
  }

  function countdown(s) {
    s = parseInt(s, 10);
    if (!(s >= 1 && s <= 5999)) return status('err', 'Seconds must be 1 to 5999');
    call(`/countdown?s=${s}`, `Counting down from ${s}s`);
  }

  $('sendText').onclick = sendText;
  $('text').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
  $('startCd').onclick = () => countdown($('secs').value);
  $('secs').addEventListener('keydown', e => { if (e.key === 'Enter') countdown($('secs').value); });
  document.querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => countdown(b.dataset.s));
  $('clock').onclick = () => call('/clock', 'Showing time');
  $('bright').oninput = () => { $('bv').textContent = $('bright').value; };
  $('bright').onchange = () => {
    store.set('bright', $('bright').value);
    call(`/brightness?v=${$('bright').value}`, `Brightness ${$('bright').value}`);
  };
</script>
</body>
</html>
